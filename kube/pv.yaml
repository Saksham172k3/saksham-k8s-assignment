apiVersion: v1
kind: PersistentVolume
metadata:
  name: ebs-pv
  labels:
    app: getting-started
spec:
  capacity:
    storage: 20Gi 
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain 
  storageClassName: gp3 
  csi:
    driver: ebs.csi.aws.com
    volumeHandle: vol-0fe5d794538c981aa
    fsType: ext4
